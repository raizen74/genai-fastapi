name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
env:
  PYTHON_VERSION: "3.10"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Only run if it's a tag push (not a regular commit to main)
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # (Optional) Use a specific version of uv
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: |
          uv build

      - name: Extract release notes
        id: extract_notes
        run: |
          # Extract tag name
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Create release notes
          echo "Release $TAG_NAME" > release_notes.md
          echo "" >> release_notes.md

          # Try to extract changelog section for this version if CHANGELOG.md exists
          if [ -f "CHANGELOG.md" ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release_notes.md
          else
            echo "Built from commit: $GITHUB_SHA" >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
